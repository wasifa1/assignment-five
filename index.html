<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Title and Logo  -->
    <title>Github Issue Tracker</title>
    <link rel="shortcut icon" href="assets/github-logo.png" type="image/x-icon">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Tailwind + DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Font Integration -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    </head>

<body class="bg-gray-100  mx-auto">
    <!-- Login Section -->
    <section id="login-section" class="hidden min-h-screen flex items-center justify-center " >
        
        
        <fieldset class="fieldset bg-white shadow-md  rounded-box w-md p-4  flex flex-col gap-4 items-center">
            <div class="flex flex-col items-center ">
                <img class="w-[50%]" src="assets/github-logo.png" alt="">
                <legend class="fieldset-legend text-center text-xl font-bold">GitHub Issues Tracker</legend>
                <p class="text center text-sm text-gray-500">Sign in to manage your issues</p>
            </div>
            

            <div class="flex flex-col w-[100%]">
            <label class="label text-sm font-semibold text-black">Username</label>
            <input id="username" type="text" class="input w-[100%]" placeholder="Enter Username" />
            <p class="mb-2 text-xs text-[#4A00FF]">Default : admin</p>

            <label class="label text-sm font-semibold text-black">Password</label>
            <input id="password" type="password" class="input w-[100%]" placeholder="Enter Password" />
            <p class="text-xs text-[#4A00FF]">Default : admin123</p>
            </div>

            <button id="login-btn" class="w-[100%] btn btn-primary mt-2">Sign In</button>
            <div class="relative w-full">
                <div class="border-t border-gray-300">
                    <span class="absolute left-1/2 -translate-x-1/2 text-sm -top-3 bg-white px-2">OR</span>
                </div>
            </div>
            <p class="text-sm text-gray-500 text center">Demo Credentials:</p>
            <div class="flex flex-col items-center rounded-sm bg-gray-100 w-[100%] py-2">
                <p class="text-sm"><span class="font-bold">Username:</span> admin</p>
                <p class="text-sm"><span class="font-bold">Password:</span> admin123</p>
            </div>
    </fieldset>

    </section>
    <!-- Main Section -->
<section id="main-section" class="">
    <!-- Navbar -->
    <header class="">
<div class="navbar bg-base-100 shadow-sm md:px-20">
  <div class="flex-1 flex flex-row items-center ">
    <img src="assets/github-logo.png" class=" w-[10%] h-[20%] md:w-10 md:h-full" alt="">
    <a class="btn btn-ghost text-sm md:text-2xl font-semibold">Github Issues Tracker</a>
  </div>
  <div class="flex gap-2">
    <input type="text" placeholder="Search Issues" class="input input-bordered w-18 md:w-auto" />
    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button" class="btn btn-primary text-xs md:text-lg">
          + New Issue
        </div>
      </div>
      
    </div>
  </div>
</div>

    </header>


    <!-- Category Buttons --> 
     <section class="flex flex-row gap-2 md:mx-20 bg-white p-4 rounded-sm my-4 mx-8 md:justify-start justify-center">
        <button onclick="filterIssues('all')" id="all-btn" class="btn btn-primary ">All</button>
        <button onclick="filterIssues('open')" id="open-btn" class="btn ">Open</button>
        <button onclick="filterIssues('closed')" id="closed-btn" class="btn">Closed</button>

     </section>


    <!-- All Issues -->
    <section class="mx-8 md:mx-20 my-4">
        <!-- Issue numbers   -->
         <div class="flex flex-row justify-between bg-white border-b border-gray-200 p-4 rounded-sm">
            <div class="flex flex row gap-1 items-center justify-start">
                <img class="w-auto h-[60%]" src="assets/Aperture.png" alt="">
                <div class="flex flex-col gap-">
                    <h3 class="text-xl font-bold "><span id="issue-number"></span> Issues</h3>
                    <p class="text-sm text-gray-500">Track and manage your project issues</p>
                </div>
            </div>
            <div class="flex flex-row gap-2 items-center">
                <i class="fa-solid fa-circle text-sm" style="color: rgb(74, 222, 128);"></i>
                <span>Open</span>
                <i class="fa-solid fa-circle text-sm" style="color: rgb(192, 132, 252);"></i>
                <span>Closed</span>
            </div>
         </div>
        <!-- Issue Cards -->
        <div id="issue-container" class="grid grid-cols-1 md:grid-cols-4 gap-4 p-4 bg-gray-50" ">
        </div>

    </section>
        


</section> 
    <!-- main section close -->

    <script src="script.js"></script>
</body>
</html>
